name: Build Windows App

on:
  push:
    branches: [ main ]
    paths:
      - 'windows/**'
      - '.github/workflows/windows-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish
        run: dotnet publish windows/BatteryAlert.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

      - name: Zip output
        shell: pwsh
        run: Compress-Archive -Path publish\BatteryAlert.exe -DestinationPath BatteryAlert-Windows.zip

      - name: Create/Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-latest-build
          name: نسخه ویندوز هشدار باتری
          files: BatteryAlert-Windows.zip
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
